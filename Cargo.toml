[package]
name = "curator-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ethnum = "1.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# No panics on input data: these are errors in the library and binary. Tests
# may use them (see clippy.toml).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
